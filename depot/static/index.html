<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Define Repo</title>
<link rel="icon" href="/CydiaIcon.png">
<style>
  :root { color-scheme: light dark; --bg: #f2f2f7; --card: #fff; --fg: #1c1c1e; --muted: #6e6e73; --tint: #1c1c1e; --on-tint: #fff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #000; --card: #1c1c1e; --fg: #f2f2f7; --muted: #98989f; --tint: #f2f2f7; --on-tint: #000; } }
  body { margin: 0; padding: 32px 16px; background: var(--bg); color: var(--fg); font: 16px/1.5 -apple-system, system-ui, sans-serif; }
  main { max-width: 560px; margin: 0 auto; }
  header { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }
  h1 { margin: 0; font-size: 26px; } .muted { color: var(--muted); margin: 0; }
  .card { background: var(--card); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  .buttons { display: grid; gap: 10px; }
  .buttons a { display: block; text-align: center; padding: 12px; border-radius: 10px; background: var(--tint); color: var(--on-tint); text-decoration: none; font-weight: 600; }
  .url { display: flex; align-items: center; gap: 8px; padding: 4px 4px 4px 12px; border-radius: 8px; background: color-mix(in srgb, var(--muted) 15%, transparent); }
  .url code { flex: 1; min-width: 0; word-break: break-all; }
  .copy { flex: none; display: grid; place-items: center; width: 36px; height: 36px; padding: 0; border: 0; border-radius: 8px; background: transparent; color: var(--muted); cursor: pointer; }
  .copy:hover { background: color-mix(in srgb, var(--muted) 15%, transparent); color: var(--fg); }
  .copy:focus-visible { outline: 2px solid var(--tint); outline-offset: 1px; }
  .copy svg { width: 18px; height: 18px; }
  .copy .done, .copy.copied .idle { display: none; }
  .copy.copied .done { display: block; color: var(--fg); }
  ul { padding-left: 18px; margin: 0; } li + li { margin-top: 6px; }
</style>
</head>
<body>
<main>
  <header>
    <div><h1>Define Repo</h1><p class="muted">Tweaks for roothide &amp; rootless jailbreaks</p></div>
  </header>

  <div class="card buttons">
    <a href="sileo://source/https://apt.define.to/">Add to Sileo</a>
    <a href="zbra://sources/add/https://apt.define.to/">Add to Zebra</a>
    <a href="cydia://url/https://cydia.saurik.com/api/share#?source=https://apt.define.to/">Add to Cydia</a>
  </div>

  <div class="card">
    <p class="muted" style="margin-bottom:8px">Or add this URL manually:</p>
    <div class="url">
      <code id="source-url">https://apt.define.to/</code>
      <button class="copy" type="button" aria-label="Copy URL" title="Copy URL">
        <svg class="idle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <svg class="done" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
      </button>
    </div>
  </div>

  <div class="card" id="packages"><p class="muted">Loading packages…</p></div>
</main>
<script>
  // Copy the repo URL; fall back to selecting the text + execCommand when the Clipboard API is unavailable
  document.querySelector('.copy').addEventListener('click', async (e) => {
    const button = e.currentTarget
    const text = document.getElementById('source-url').textContent
    try {
      await navigator.clipboard.writeText(text)
    } catch {
      const range = document.createRange()
      range.selectNodeContents(document.getElementById('source-url'))
      getSelection().removeAllRanges()
      getSelection().addRange(range)
      document.execCommand('copy')
      getSelection().removeAllRanges()
    }
    button.classList.add('copied')
    button.setAttribute('aria-label', 'Copied')
    clearTimeout(button.timer)
    button.timer = setTimeout(() => {
      button.classList.remove('copied')
      button.setAttribute('aria-label', 'Copy URL')
    }, 1500)
  })

  // List the packages in the repo (from the public /api/v1/packages)
  fetch('/api/v1/packages')
    .then((r) => r.json())
    .then((list) => {
      const box = document.getElementById('packages')
      if (!list.length) { box.innerHTML = '<p class="muted">No packages yet.</p>'; return }
      // On iPhone / iPad, package names link to Sileo; other devices just show text
      const ios = /iPhone|iPad|iPod/.test(navigator.userAgent)
      const ul = document.createElement('ul')
      for (const item of list) {
        const li = document.createElement('li')
        const name = document.createElement(ios ? 'a' : 'strong')
        if (ios) name.href = `sileo://package/${encodeURIComponent(item.package)}`
        name.textContent = item.meta?.name || item.latest.control.Name || item.package
        const summary = document.createElement('p')
        summary.className = 'muted'
        summary.textContent = (item.latest.control.Description || '').split('\n')[0]
        li.append(name, ` — ${item.latest.version}`, summary)
        ul.append(li)
      }
      box.replaceChildren(ul)
    })
    .catch(() => { document.getElementById('packages').innerHTML = '<p class="muted">Failed to load packages.</p>' })
</script>
</body>
</html>
