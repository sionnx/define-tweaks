name: Tweaks

# - Push to main / PR: build every tweak to make sure it packages
# - Push a <tweak>@<version> tag (e.g. dockreel@0.1.0): build that tweak and publish it to apt.define.to
on:
  push:
    branches: [main]
    tags: ['*@*']
    paths:
      - tweaks/**
      - shared/**
      - .github/actions/setup-theos/**
      - .github/workflows/tweaks.yml
  pull_request:
    paths:
      - tweaks/**
      - shared/**
      - .github/actions/setup-theos/**
      - .github/workflows/tweaks.yml

permissions:
  contents: read

jobs:
  build:
    if: github.ref_type != 'tag'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-theos

      - name: Build all tweaks
        run: |
          for dir in tweaks/*/; do
            [[ -f $dir/Makefile ]] || continue
            echo "::group::${dir%/}"
            make -C "$dir" package FINALPACKAGE=1
            echo "::endgroup::"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: tweaks/*/packages/*.deb
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    runs-on: macos-latest
    permissions:
      contents: read
      # Request a GitHub OIDC token; depot uses it to verify where the release comes from
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Resolve tweak from tag
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          name=${TAG%@*}
          version=${TAG#*@}
          # Tags use the lowercased tweak name; directory names may use any case
          # A plain if: under bash -e, a trailing `[[ ]] && …` that does not
          # match would fail the step whenever the tweak is not listed last.
          dir=
          for d in tweaks/*/; do
            d=${d%/}
            if [[ $(basename "$d" | tr '[:upper:]' '[:lower:]') == "$name" ]]; then
              dir=$d
              break
            fi
          done
          [[ -n $dir ]] || { echo "::error::Tweak directory not found: tweaks/$name"; exit 1; }

          control_version=$(sed -n 's/^Version: *//p' "$dir/control")
          if [[ $control_version != "$version" ]]; then
            echo "::error::Tag version $version does not match $control_version in $dir/control"
            exit 1
          fi

          # An annotated tag's message is the changelog; lightweight tags fall back to the commit message
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          {
            echo "dir=$dir"
            echo "changelog<<EOF"
            git for-each-ref "refs/tags/$TAG" --format='%(contents)' | sed '/^-----BEGIN PGP SIGNATURE-----/,$d'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-theos

      - name: Build package
        run: make -C "${{ steps.tag.outputs.dir }}" package FINALPACKAGE=1

      - name: Publish to apt.define.to
        env:
          DIR: ${{ steps.tag.outputs.dir }}
          CHANGELOG: ${{ steps.tag.outputs.changelog }}
        run: |
          DEPOT_TOKEN=$(curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=apt.define.to" | jq -r .value)
          export DEPOT_TOKEN
          # Pin the Source Code link to the commit this release was built from
          export SOURCE_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/tree/$(git rev-parse HEAD)/$DIR"
          for deb in "$DIR"/packages/*.deb; do
            scripts/publish.sh "$deb" "$CHANGELOG"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ github.ref_name }}
          path: ${{ steps.tag.outputs.dir }}/packages/*.deb
