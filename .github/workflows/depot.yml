name: Depot

# Typecheck and test only; Cloudflare Workers Builds deploys after main is updated
on:
  push:
    branches: [main]
    paths:
      - depot/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/depot.yml
  pull_request:
    paths:
      - depot/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/depot.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: depot
    steps:
      - uses: actions/checkout@v7
      # Version comes from packageManager in the root package.json
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
