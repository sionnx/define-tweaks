name: Setup roothide Theos
description: Install roothide/theos, an iOS SDK and build dependencies (GNU make, ldid)

inputs:
  sdk:
    description: SDK to install (from theos/sdks)
    default: iPhoneOS16.5

runs:
  using: composite
  steps:
    - name: Install build tools
      shell: bash
      run: |
        brew install ldid make xz
        # Theos needs GNU make 4; macOS ships 3.81
        echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

    - name: Resolve roothide/theos revision
      id: rev
      shell: bash
      run: echo "sha=$(git ls-remote https://github.com/roothide/theos HEAD | cut -f1)" >> "$GITHUB_OUTPUT"

    # Tweak Makefiles default to ~/theos-roothide, so install it there
    - name: Cache Theos
      id: cache
      uses: actions/cache@v6
      with:
        path: ~/theos-roothide
        key: theos-roothide-${{ steps.rev.outputs.sha }}-${{ inputs.sdk }}

    - name: Install Theos and SDK
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        # install-sdk calls the GitHub API; pass a token to avoid rate limits
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        THEOS="$HOME/theos-roothide"
        git clone --recursive --depth 1 --shallow-submodules https://github.com/roothide/theos "$THEOS"
        THEOS="$THEOS" "$THEOS/bin/install-sdk" "${{ inputs.sdk }}"

    - name: Export THEOS
      shell: bash
      run: echo "THEOS=$HOME/theos-roothide" >> "$GITHUB_ENV"
